(function(){
const USER="CookiesHouse",enc=new TextEncoder();

const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const CATS=["Carne","Pescado y marisco","Pasta y arroces","Cremas y sopas","Legumbres","Verduras y ensaladas","Huevos y tortillas","Pizzas","Bocadillos, wraps y tostas","Postres","Otros"];

const pendNames=()=>{const have=new Set(S.recetas.map(r=>norm(r.nombre))),m=new Map();S.menu.forEach(x=>{if(!x.plato||x.plato==="Libre"||x.ev)return;const k=norm(x.plato);if(have.has(k))return;const o=m.get(k)||{nombre:x.plato,tipos:new Set(),ing:[]};o.tipos.add(x.tipo);if(x.ing?.length&&!o.ing.length)o.ing=x.ing;m.set(k,o)});return[...m.values()]};
async function recSync(){for(const o of pendNames())await put("recetas",{nombre:o.nombre,cat:"Sin clasificar",mom:o.tipos.size>1?"Ambas":[...o.tipos][0],ing:o.ing});say("Recetario actualizado")}
async function upsertRec(nombre,cat,tipo,ing){if(!nombre||nombre==="Libre")return;const k=norm(nombre),r=S.recetas.find(x=>norm(x.nombre)===k)||RA.get(k);
 if(!r){const n={id:uid(),nombre,cat:CATS.includes(cat)?cat:"Sin clasificar",mom:tipo,ing:ing||[]};RA.set(k,n);await put("recetas",n);return}
 if(r.mom!==tipo&&r.mom!=="Ambas"){r.mom="Ambas";await put("recetas",{...r})}}
async function aiRec(lines){const r=await sample.json(`Eres cocinero y dietista en España. Para cada receta devuelve categoría (una de: ${CATS.join(", ")}), momento (Comida, Cena o Ambas, según para qué sirve) y ingredientes sin cantidades. Si no te doy ingredientes, propón los habituales y pon inferido:true. Recetas, una por línea (opcional "nombre | ingredientes"):\n${lines}\nResponde SOLO con JSON: {"recetas":[{"nombre":"","categoria":"","momento":"","ingredientes":[""],"inferido":false}]}`,{cache:false});return r.recetas||[]}
async function saveAI(o){const k=norm(o.nombre||"");if(!k)return;const r=S.recetas.find(x=>norm(x.nombre)===k)||RA.get(k);
 const d={cat:CATS.includes(o.categoria)?o.categoria:"Otros",mom:["Comida","Cena","Ambas"].includes(o.momento)?o.momento:"Ambas",ing:o.ingredientes||[],inf:!!o.inferido};
 if(r){const pe=r.cat==="Sin clasificar",tg=(r.ing||[]).length;await put("recetas",{...r,cat:pe?d.cat:r.cat,mom:pe&&r.mom!=="Ambas"?d.mom:r.mom,ing:tg?r.ing:d.ing,inf:tg?r.inf:d.inf});return}
 const n={id:uid(),nombre:o.nombre,...d};RA.set(k,n);await put("recetas",n)}
async function recAI(){rb=true;render();try{const L=S.recetas.filter(r=>r.cat==="Sin clasificar").map(r=>r.nombre+(r.ing?.length?" | "+r.ing.join(", "):""));
 for(let i=0;i<L.length;i+=15)for(const o of await aiRec(L.slice(i,i+15).join("\n")))await saveAI(o);say("Recetas clasificadas")}catch(e){say("No pude clasificarlas todas")}rb=false;render()}
function recImp(){const o=$("#md");o.className="on";o.innerHTML=`<div class="mc"><div class="f" style="font-size:20px">Importar recetas</div><p class="mu">Pega tu lista, una receta por línea. Puedes añadir ingredientes tras «|». La IA las clasifica y propone los ingredientes que falten; revísalos.</p><textarea id="ti" rows="8" placeholder="Lentejas estofadas&#10;Salmón al horno | salmón, patata, limón"></textarea><button class="b" onclick="recImpGo()" ${sample?"":"disabled"}>Clasificar y guardar</button><button class="b s" onclick="mclose()">Cancelar</button></div>`}

 let n=0;for(const o of r.recetas||[]){const x=L[o.n-1];if(!x||!o.ingredientes?.length)continue;await put("recetas",{...x,ing:o.ingredientes,inf:true});n++}return n}
async function ingAI(){const L=noIng();if(!L.length)return;rb=true;let ok=0,done=0;

(async()=>{if(!window.claude)return;try{sample=await claude.use("sample")}catch(e){}if(sample){try{const c=await sample.limits();capImg=c.images||false}catch(e){capImg=false}}
 try{db=await claude.use("db")}catch(e){}
 if(db)for(const c of ["menu","compra","recetas"])db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));render()});
 render()})();

function openSet(){const o=$("#md");o.className="on";o.innerHTML=`<div class="mc"><div class="f" style="font-size:20px">Ajustes</div>
<label class="mu">Clave de API de Anthropic (bot y sugerencias)</label><input id="sk" type="password" placeholder="sk-ant-…" autocomplete="off" value="${esc(localStorage.getItem("ak")||"")}">
<label class="mu">Client ID de Google (calendario)</label><input id="gk" placeholder="…apps.googleusercontent.com" autocomplete="off" value="${esc(localStorage.getItem("gc")||"")}">
<label class="mu">Teléfono de David (para «He olvidado el PIN»)</label><input id="td" type="tel" value="${esc(localStorage.getItem("tdv")||"")}"><label class="mu">Teléfono de Alba</label><input id="ta" type="tel" value="${esc(localStorage.getItem("tal")||"")}"><button class="b" onclick="saveSet()">Guardar</button>
<div class="row"><button class="b s" onclick="expData()">Exportar copia</button><button class="b s" onclick="$('#bk').click()">Importar copia</button></div><input type="file" id="bk" accept="application/json,.json" hidden onchange="impData(this.files[0])">
<button class="b s" onclick="lkChange()">Cambiar PIN</button><button class="b s" onclick="lkBio()">Activar huella / Face ID</button><button class="b s" onclick="lkLock()">Bloquear ahora</button><button class="b s" onclick="mclose()">Cerrar</button><div class="mu">Los datos se guardan solo en este móvil. Para pasarlos a otro, exporta una copia y la importas allí.</div></div>`}
function saveSet(){try{localStorage.setItem("ak",$("#sk").value.trim());localStorage.setItem("gc",$("#gk").value.trim());localStorage.setItem("tdv",$("#td").value.trim());localStorage.setItem("tal",$("#ta").value.trim())}catch(e){}mclose();say("Ajustes guardados")}
function expData(){const b=new Blob([JSON.stringify({menu:S.menu,compra:S.compra,recetas:S.recetas})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cookies-house-copia-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
async function impData(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.menu)||!Array.isArray(d.compra)||!Array.isArray(d.recetas))throw 0;if(!confirm("Esto reemplaza los datos de este móvil. ¿Continuar?"))return;S.menu=d.menu;S.compra=d.compra;S.recetas=d.recetas;lsSave();mclose();render();say("Copia importada")}catch(e){say("Ese archivo no es una copia válida")}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
